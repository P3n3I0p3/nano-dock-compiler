name: Compiler bauen und testen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # nur für Releases bei Tags

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build ccache

      # Zwischenspeicher für übersetzte Dateien: spätere Läufe sind viel schneller,
      # auch wenn der vorige Lauf fehlgeschlagen ist
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: LLVM mit AVR als WebAssembly bauen
        env:
          CCACHE_MAXSIZE: 5G
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache
          ./build.sh
          ccache -s

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.run_id }}

      - name: Größe
        run: |
          gzip -9 -k dist/llvm.wasm
          ls -la dist
          echo "### Größe" >> "$GITHUB_STEP_SUMMARY"
          echo "llvm.wasm: $(du -h dist/llvm.wasm | cut -f1), gepackt: $(du -h dist/llvm.wasm.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nano-dock-compiler
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nano-dock-compiler
          path: dist

      - name: avr-libc, libgcc und wasmtime
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq avr-libc gcc-avr
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/wasmtime-v50.0.1-x86_64-linux.tar.xz | tar xJf -
          echo "$PWD/wasmtime-v50.0.1-x86_64-linux" >> "$GITHUB_PATH"

      - name: Arduino-Core
        run: git clone --depth 1 --branch 1.8.8 https://github.com/arduino/ArduinoCore-avr.git test/work/core

      - name: Sketches mit dem WebAssembly-Compiler übersetzen
        run: |
          test/test.sh
          cat test/work/out/bericht.md >> "$GITHUB_STEP_SUMMARY"

      - name: IDE zusammenstellen
        run: web/package.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Derselbe JavaScript-Code wie im Browser; die HEX-Dateien müssen mit denen aus test.sh übereinstimmen
      - name: Browser-Compiler mit Node.js testen
        run: node web/test-node.mjs ide test/sketches test/work/out

      - uses: actions/upload-artifact@v4
        with:
          name: nano-dock-ide
          path: ide/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ergebnisse
          path: test/work/out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nano-dock-compiler
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nano-dock-ide
          path: ide
      - name: Release mit llvm.wasm und der fertigen IDE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd ide && zip -r ../dist/nano-dock-ide.zip .)
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "LLVM mit AVR als WebAssembly und die Browser-IDE, getestet mit den Nano-Sketches."
